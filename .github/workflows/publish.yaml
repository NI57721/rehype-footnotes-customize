name: 'Publish'
on: ['push', 'pull_request', 'workflow_dispatch']
permissions:
  contents: 'read'
  id-token: 'write'
jobs:
  publish:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@v6'
      - uses: 'pnpm/action-setup@v6'
        with:
          version: 10
      - uses: 'actions/setup-node@v6'
        with:
          node-version: 25
      - run: 'pnpm install --no-frozen-lockfile'
      - run: 'pnpm run build'
      - run: 'pnpm run lint'
      - run: 'pnpm run test'
      - run: 'pnpm publish'
